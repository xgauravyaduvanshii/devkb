name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/lint.js
      - run: node tools/build-index.js
      - run: node --test tools/__tests__
